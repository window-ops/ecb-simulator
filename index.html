            <div>
              <h1 id="nojs-title">The euro area economy has collapsed</h1>
              <p>The president of the European Central Bank sat down to read the year's briefing, but the office computer would not run it: JavaScript is turned off. With no one at the controls, the Governing Council could not meet, markets panicked, spreads ran out of control and the economy collapsed.</p>
              <p>To restore order, turn on JavaScript in your browser's settings and reload the page. The game runs entirely in your browser and sends nothing anywhere.</p>
